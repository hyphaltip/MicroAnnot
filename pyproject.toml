[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymicrosporidiaannot"
version = "1.0.0"
description = "pyMicrosporidiaAnnot – microsporidia genome annotation pipeline (Python port of microannot.pl)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bioinformatics", "genomics", "microsporidia", "annotation", "gene-prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "flake8",
]

[project.scripts]
pymicrosporidiaannot              = "pymicrosporidiaannot.cli:main"
pymicrosporidiaannot-funannotate  = "pymicrosporidiaannot.funannotate.shunt:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymicrosporidiaannot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
